<main class="container py-5 flex-grow-1">
    <h1 class="mb-2">Contact</h1>
    <p class="mb-4">vul het formulier in om contact met mij op te nemen.</p>

    <section class="row g-4">

      <form class="col-12 col-md-7 row g-3 needs-validation" name="contact" netlify data-netlify="true" method="POST" novalidate>
        
      <div class="col-md-6">
        <label for="voornaam" class="form-label">Voornaam</label>
        <input type="text" class="form-control" id="voornaam" name="voornaam" required>
      </div> 

      <div class="col-md-6">
        <label for="achternaam" class="form-label">Achternaam</label>
        <input type="text" class="form-control" id="achternaam" name="achternaam" required>
      </div> 

      <div class="col-md-6">
        <label for="stad" class="form-label">Stad</label>
        <input type="text" class="form-control" id="stad" name="stad" required>
      </div> 
      
      
      <div class="col-md-6">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" name="email" required>
      </div> 

    <div class="col-12">
      <label for="bericht" class="form-label">Bericht</label>
      <textarea class="form-control" id="bericht" name="bericht" rows="4" required></textarea>
    </div>

    <div class="col-12">
      <button type="submit" class="btn btn-outline-light px-4">Versturen</button>
  </div>
  </form>
  <aside class="col-12 col-md-4 offset-md-1">
